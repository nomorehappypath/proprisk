[project]
name = "proprisk-backend"
version = "0.1.0"
description = "PropRisk — FastAPI backend for the open-source, single-user property lookup"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.7",
    "uvicorn[standard]==0.51.0",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "openai==2.49.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "requests==2.34.2",
    "numpy==2.5.1",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "pypdf==6.21.4",
    "pyyaml==6.0.3",
    "tifffile==2026.7.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: `Depends(...)` in defaults is the standard FastAPI dependency idiom.
# BLE001: boundary catch-alls (passlib verify, live key probe) are deliberate.
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
