# Pflugerville, TX — Unified Development Code
# Source: https://library.municode.com/tx/pflugerville/codes/code_of_ordinances
# Last verified: 2026-05-02
#
# Coverage: 8 broker-grade districts.
#   A, SF-R, SF-S, MF-12, MF-25, RT, RC, RIA
# Pflugerville's UDC organizes uses by use category and
# permits matrix; numbers below are the base district rules
# from Title XV Land Development Code.

city: pflugerville
state: TX
udc_version: "Pflugerville Unified Development Code (Title XV LDC)"
udc_source_url: "https://library.municode.com/tx/pflugerville/codes/code_of_ordinances"
last_verified: "2026-05-02"

districts:

