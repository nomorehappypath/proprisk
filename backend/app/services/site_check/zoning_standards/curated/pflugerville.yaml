      - use_id: telecom_tower
        code_ref: "LDC §15-A"
    prohibited_uses:
      - use_id: multifamily_residential
        code_ref: "LDC §15-A"
      - use_id: general_retail
        code_ref: "LDC §15-A"
    dimensional_standards:
      max_density:
        value: 0.2
        unit: "units_per_acre"
        code_ref: "LDC §15-A"
      max_height:
        value: 35
        unit: "feet"
        code_ref: "LDC §15-A"
      min_lot_size:
        value: 217800
        unit: "square_feet"
        code_ref: "LDC §15-A"
      front_setback:
        value: 50
        unit: "feet"
        code_ref: "LDC §15-A"
      side_setback:
        value: 25
        unit: "feet"
        code_ref: "LDC §15-A"
      rear_setback:
        value: 50
        unit: "feet"
        code_ref: "LDC §15-A"
      max_impervious_cover:
        value: 25
        unit: "percent"
        code_ref: "LDC §15-A"
    parking:
      - use_id: single_family_detached
        rate: 2.0
        unit: "spaces_per_unit"
        code_ref: "LDC §15-Parking"

