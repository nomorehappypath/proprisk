# Hutto, TX — Unified Development Code (UDC)
# Source: https://www.huttotx.gov/DocumentCenter/View/3779/UDC-Updated-through-March-2024
# Last verified: 2026-05-02
#
# Coverage: 9 broker-grade districts seeded.
#   AG, SF-1, SF-2, MF-1, MF-2, GR, GC, LI, MU
#
# Hutto's UDC is reorganized periodically; current sections
# referenced are based on the March 2024 update. Numeric
# standards captured below reflect base district rules and do
# NOT include PUD-modified parcels (Hutto has many master-
# planned PUDs that supersede base district rules — those
# parcels need parcel-specific PUD documents uploaded).

city: hutto
state: TX
udc_version: "Hutto Unified Development Code (UDC, March 2024)"
udc_source_url: "https://www.huttotx.gov/DocumentCenter/View/3779/UDC-Updated-through-March-2024"
last_verified: "2026-05-02"

districts:

  # ── AG: Agricultural ────────────────────────────────────────
  AG:
    full_name: "Agricultural District"
    code_section: "UDC §3.2"
    purpose: "Holding district for unimproved or agricultural land."
    permitted_uses:
      - use_id: agricultural
        code_ref: "UDC §3.2.B"
      - use_id: ag_exempt
        code_ref: "UDC §3.2.B"
      - use_id: single_family_detached
        code_ref: "UDC §3.2.B"
        notes: "One single-family per 5 acres."
    conditional_uses:
      - use_id: solar_farm
        code_ref: "UDC §3.2.C"
      - use_id: telecom_tower
        code_ref: "UDC §3.2.C"
    prohibited_uses:
      - use_id: multifamily_residential
        code_ref: "UDC §3.2.D"
      - use_id: general_retail
        code_ref: "UDC §3.2.D"
    dimensional_standards:
      max_density:
        value: 0.2
        unit: "units_per_acre"
        code_ref: "UDC §3.2.E"
        notes: "1 du / 5 acres."
      max_height:
        value: 35
        unit: "feet"
        code_ref: "UDC §3.2.E"
      min_lot_size:
        value: 217800
        unit: "square_feet"
        code_ref: "UDC §3.2.E"
        notes: "5 acres minimum."
      front_setback:
        value: 50
        unit: "feet"
        code_ref: "UDC §3.2.E"
      side_setback:
        value: 25
        unit: "feet"
        code_ref: "UDC §3.2.E"
      rear_setback:
        value: 50
        unit: "feet"
        code_ref: "UDC §3.2.E"
      max_impervious_cover:
        value: 25
        unit: "percent"
        code_ref: "UDC §3.2.E"
    parking:
      - use_id: single_family_detached
        rate: 2.0
        unit: "spaces_per_unit"
        code_ref: "UDC §6.4"

