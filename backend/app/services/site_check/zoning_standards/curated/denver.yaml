# Denver, CO - Denver Zoning Code (Articles 4, 5, 7, 8, 9)
# Source: official article PDFs on denvergov.org (republished February 25, 2025), read 2026-11-18.
#   https://denvergov.org/files/assets/public/community-planning-and-development/documents/zoning/denver-zoning-code/
# Curated ONLY from numbers printed in those tables. Districts not listed here are not curated
# (the zoning-standards source then says so). Uses and parking are not curated.
# Mixed-use heights are the General/Shopfront form limits; other forms have their own limits.
# Keys match the zone codes the city's zoning map serves, upper case (U-MX-2X is the code's "2x").
# The code has been amended since 2025-02-25; a zoning verification letter is the binding answer.
