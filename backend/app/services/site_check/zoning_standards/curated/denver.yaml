  included)
udc_source_url: https://denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Denver-Zoning-Code
last_verified: '2026-11-18'
districts:
  U-SU-A:
    full_name: Urban Single Unit A (U-SU-A)
    code_section: 5.2.2
    dimensional_standards:
      max_stories:
        value: 2.5
        unit: stories
        code_ref: DZC 5.3.3.3.A (Urban House building form)
        notes: Front 65% of lot depth; rear 35% of lot depth is 1 story.
      max_height:
        value: 30
        unit: feet
        code_ref: DZC 5.3.3.3.A (Urban House building form)
        notes: 'Front 65% of zone lot depth; rear 35% is 17 ft. Up to 35 ft with 1 ft added per 5 ft of lot width
          over 50 ft. '
      min_lot_size:
        value: 3000
        unit: square_feet
        code_ref: DZC 5.3.3.3.A (Urban House building form)
      min_lot_width:
        value: 25
        unit: feet
        code_ref: DZC 5.3.3.3.A (Urban House building form)
      front_setback:
        value: Calculated per DZC 13.1.5.9
        unit: null
        code_ref: DZC 5.3.3.3.A (Urban House building form)
        notes: Set from the existing front setbacks of reference lots on the block, not a fixed number (DZC 13.1.5.9).
      side_setback:
        value: 3
        unit: feet
        code_ref: DZC 5.3.3.3.A (Urban House building form)
        notes: 'Setbacks and coverage depend on the actual zone lot width: 30 ft or less: side street 3, side interior
          3, coverage 60%; over 30 to 40 ft: side street 5, side interior 3 min one side / 10 combined, coverage
          45%; over 40 to under 75 ft: side street 5, side interior 5, coverage 45%; 75 ft or more: side street
          7.5, side interior 10, coverage 40%. Values below are for a lot at this district''s minimum width.'
      side_setback_corner:
        value: 3
        unit: feet
        code_ref: DZC 5.3.3.3.A (Urban House building form)
        notes: Side street setback for this lot width.
      rear_setback:
        value: 20
        unit: feet
        code_ref: DZC 5.3.3.3.A (Urban House building form)
        notes: 20 ft where no alley abuts the rear lot line; 12 ft where an alley abuts it.
      max_building_coverage:
        value: 60
        unit: percent
        code_ref: DZC 5.3.3.3.A (Urban House building form)
        notes: Includes all accessory structures.
