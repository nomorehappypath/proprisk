# Buda, TX — Land Development Code
# Source: https://budatx.gov/297/Documents-Resources
# Last verified: 2026-05-02
#
# Coverage: 6 broker-grade districts.
#   AG, R-1, R-3, MF-2, C-2, M-1

city: buda
state: TX
udc_version: "Buda Land Development Code"
udc_source_url: "https://budatx.gov/297/Documents-Resources"
last_verified: "2026-05-02"

districts:

  AG:
    full_name: "Agricultural"
    code_section: "LDC §AG"
    permitted_uses:
      - {use_id: agricultural, code_ref: "LDC §AG"}
      - {use_id: ag_exempt, code_ref: "LDC §AG"}
      - {use_id: single_family_detached, code_ref: "LDC §AG", notes: "1 du / 5 acres."}
    conditional_uses:
      - {use_id: solar_farm, code_ref: "LDC §AG"}
    prohibited_uses:
      - {use_id: multifamily_residential, code_ref: "LDC §AG"}
      - {use_id: general_retail, code_ref: "LDC §AG"}
    dimensional_standards:
      max_density: {value: 0.2, unit: "units_per_acre", code_ref: "LDC §AG"}
      max_height: {value: 35, unit: "feet", code_ref: "LDC §AG"}
      min_lot_size: {value: 217800, unit: "square_feet", code_ref: "LDC §AG"}
      front_setback: {value: 50, unit: "feet", code_ref: "LDC §AG"}
      side_setback: {value: 25, unit: "feet", code_ref: "LDC §AG"}
      rear_setback: {value: 50, unit: "feet", code_ref: "LDC §AG"}
      max_impervious_cover: {value: 25, unit: "percent", code_ref: "LDC §AG"}
    parking:
