# Dripping Springs, TX — Code of Ordinances
# Source: https://www.cityofdrippingsprings.com/planning
# Last verified: 2026-05-02
#
# Coverage: 5 broker-grade districts.
#   AG, R-1, R-2, RC, IC
#
# Dripping Springs has a smaller jurisdictional footprint
# centered on the historic downtown + 290 corridor. The
# Hill Country Roadway overlay (HCR) heavily affects parcels
# along the highway corridor — captured as overlay_interactions.

city: dripping_springs
state: TX
udc_version: "Dripping Springs Code of Ordinances - Title XV"
udc_source_url: "https://www.cityofdrippingsprings.com/planning"
last_verified: "2026-05-02"

districts:

  AG:
    full_name: "Agricultural"
    code_section: "ZO §AG"
    permitted_uses:
      - {use_id: agricultural, code_ref: "ZO §AG"}
      - {use_id: ag_exempt, code_ref: "ZO §AG"}
      - {use_id: single_family_detached, code_ref: "ZO §AG", notes: "1 du / 5 acres."}
    conditional_uses:
      - {use_id: solar_farm, code_ref: "ZO §AG"}
    prohibited_uses:
      - {use_id: multifamily_residential, code_ref: "ZO §AG"}
      - {use_id: general_retail, code_ref: "ZO §AG"}
    dimensional_standards:
      max_density: {value: 0.2, unit: "units_per_acre", code_ref: "ZO §AG"}
      max_height: {value: 35, unit: "feet", code_ref: "ZO §AG"}
      min_lot_size: {value: 217800, unit: "square_feet", code_ref: "ZO §AG"}
      front_setback: {value: 50, unit: "feet", code_ref: "ZO §AG"}
      side_setback: {value: 25, unit: "feet", code_ref: "ZO §AG"}
      rear_setback: {value: 50, unit: "feet", code_ref: "ZO §AG"}
      max_impervious_cover: {value: 25, unit: "percent", code_ref: "ZO §AG"}
    parking:
      - {use_id: single_family_detached, rate: 2.0, unit: "spaces_per_unit", code_ref: "ZO §Parking"}
    overlay_interactions:
      - overlay_id: HCR
        effect: >
          Hill Country Roadway overlay along US 290 corridor
          imposes additional setback (100 ft from highway ROW),
          height step-back, and tighter impervious cover.
        code_ref: "ZO §HCR"

  R-1:
    full_name: "Single Family - Estate"
    code_section: "ZO §R-1"
    permitted_uses:
      - {use_id: single_family_detached, code_ref: "ZO §R-1"}
      - {use_id: church, code_ref: "ZO §R-1"}
      - {use_id: school_public, code_ref: "ZO §R-1"}
    conditional_uses:
      - {use_id: childcare, code_ref: "ZO §R-1"}
    prohibited_uses:
      - {use_id: multifamily_residential, code_ref: "ZO §R-1"}
    dimensional_standards:
      max_density: {value: 0.5, unit: "units_per_acre", code_ref: "ZO §R-1"}
      max_height: {value: 35, unit: "feet", code_ref: "ZO §R-1"}
      min_lot_size: {value: 87120, unit: "square_feet", code_ref: "ZO §R-1", notes: "2 acres minimum."}
      front_setback: {value: 35, unit: "feet", code_ref: "ZO §R-1"}
      side_setback: {value: 20, unit: "feet", code_ref: "ZO §R-1"}
      rear_setback: {value: 30, unit: "feet", code_ref: "ZO §R-1"}
      max_impervious_cover: {value: 30, unit: "percent", code_ref: "ZO §R-1"}
    parking:
      - {use_id: single_family_detached, rate: 2.0, unit: "spaces_per_unit", code_ref: "ZO §Parking"}

  R-2:
    full_name: "Single Family - Standard"
    code_section: "ZO §R-2"
    permitted_uses:
      - {use_id: single_family_detached, code_ref: "ZO §R-2"}
      - {use_id: church, code_ref: "ZO §R-2"}
      - {use_id: school_public, code_ref: "ZO §R-2"}
    conditional_uses:
      - {use_id: childcare, code_ref: "ZO §R-2"}
      - {use_id: accessory_dwelling_unit, code_ref: "ZO §R-2"}
    prohibited_uses:
      - {use_id: duplex, code_ref: "ZO §R-2"}
      - {use_id: multifamily_residential, code_ref: "ZO §R-2"}
    dimensional_standards:
      max_density: {value: 3.0, unit: "units_per_acre", code_ref: "ZO §R-2"}
      max_height: {value: 35, unit: "feet", code_ref: "ZO §R-2"}
      min_lot_size: {value: 12000, unit: "square_feet", code_ref: "ZO §R-2"}
      front_setback: {value: 25, unit: "feet", code_ref: "ZO §R-2"}
      side_setback: {value: 10, unit: "feet", code_ref: "ZO §R-2"}
      rear_setback: {value: 25, unit: "feet", code_ref: "ZO §R-2"}
      max_impervious_cover: {value: 40, unit: "percent", code_ref: "ZO §R-2"}
    parking:
      - {use_id: single_family_detached, rate: 2.0, unit: "spaces_per_unit", code_ref: "ZO §Parking"}

  RC:
    full_name: "Retail Commercial"
    code_section: "ZO §RC"
    permitted_uses:
      - {use_id: general_retail, code_ref: "ZO §RC"}
      - {use_id: convenience_store, code_ref: "ZO §RC"}
      - {use_id: restaurant, code_ref: "ZO §RC"}
      - {use_id: office_general, code_ref: "ZO §RC"}
      - {use_id: office_medical, code_ref: "ZO §RC"}
      - {use_id: bank_or_financial, code_ref: "ZO §RC"}
      - {use_id: hotel, code_ref: "ZO §RC"}
      - {use_id: bed_and_breakfast, code_ref: "ZO §RC"}
      - {use_id: gas_station, code_ref: "ZO §RC"}
      - {use_id: auto_service, code_ref: "ZO §RC"}
      - {use_id: event_venue, code_ref: "ZO §RC"}
        # Hill Country wedding/event venues are a significant
        # use type in Dripping Springs.
    conditional_uses:
      - {use_id: bar_or_lounge, code_ref: "ZO §RC"}
      - {use_id: drive_through, code_ref: "ZO §RC"}
      - {use_id: outdoor_storage, code_ref: "ZO §RC"}
    dimensional_standards:
      max_height: {value: 40, unit: "feet", code_ref: "ZO §RC"}
      front_setback: {value: 25, unit: "feet", code_ref: "ZO §RC"}
      side_setback: {value: 10, unit: "feet", code_ref: "ZO §RC"}
      rear_setback: {value: 25, unit: "feet", code_ref: "ZO §RC"}
      max_impervious_cover: {value: 70, unit: "percent", code_ref: "ZO §RC"}
    parking:
      - {use_id: general_retail, rate: 4.0, unit: "spaces_per_1000_sf", code_ref: "ZO §Parking"}
      - {use_id: hotel, rate: 1.0, unit: "spaces_per_unit", code_ref: "ZO §Parking"}
      - {use_id: office_general, rate: 3.5, unit: "spaces_per_1000_sf", code_ref: "ZO §Parking"}
      - {use_id: event_venue, rate: 1.0, unit: "spaces_per_3_seats", code_ref: "ZO §Parking"}
    overlay_interactions:
      - overlay_id: HCR
        effect: >
          Hill Country Roadway overlay along US 290 corridor
          adds 100-ft setback from ROW + reduces max impervious
          cover for parcels within the corridor.
        code_ref: "ZO §HCR"

  IC:
    full_name: "Industrial Commerce"
    code_section: "ZO §IC"
    permitted_uses:
      - {use_id: warehouse, code_ref: "ZO §IC"}
      - {use_id: light_industrial, code_ref: "ZO §IC"}
      - {use_id: self_storage, code_ref: "ZO §IC"}
      - {use_id: data_center, code_ref: "ZO §IC"}
    conditional_uses:
      - {use_id: manufacturing, code_ref: "ZO §IC"}
      - {use_id: outdoor_storage, code_ref: "ZO §IC"}
    prohibited_uses:
      - {use_id: heavy_industrial, code_ref: "ZO §IC"}
      - {use_id: multifamily_residential, code_ref: "ZO §IC"}
    dimensional_standards:
      max_height: {value: 45, unit: "feet", code_ref: "ZO §IC"}
      front_setback: {value: 30, unit: "feet", code_ref: "ZO §IC"}
      side_setback: {value: 15, unit: "feet", code_ref: "ZO §IC"}
      rear_setback: {value: 30, unit: "feet", code_ref: "ZO §IC"}
      max_impervious_cover: {value: 65, unit: "percent", code_ref: "ZO §IC"}
    parking:
      - {use_id: warehouse, rate: 1.0, unit: "spaces_per_2000_sf", code_ref: "ZO §Parking"}
      - {use_id: light_industrial, rate: 1.0, unit: "spaces_per_1000_sf", code_ref: "ZO §Parking"}
