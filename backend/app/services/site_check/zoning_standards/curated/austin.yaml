        code_ref: "25-2-491"
      - use_id: school_public
        code_ref: "25-2-491"
      - use_id: school_private
        code_ref: "25-2-491"
    conditional_uses:
      - use_id: childcare
        code_ref: "25-2-625"
        notes: "Conditional use permit required."
      - use_id: bed_and_breakfast
        code_ref: "25-2-491"
        notes: "Subject to short-term rental rules."
    prohibited_uses:
      - use_id: multifamily_residential
        code_ref: "25-2-491"
      - use_id: general_retail
        code_ref: "25-2-491"
      - use_id: warehouse
        code_ref: "25-2-491"
      - use_id: light_industrial
        code_ref: "25-2-491"
    dimensional_standards:
      max_density:
        value: 12
        unit: "units_per_acre"
        code_ref: "25-2-492"
        notes: "Effective with 2024 HOME amendments (was 4)."
      max_height:
        value: 35
        unit: "feet"
        code_ref: "25-2-492"
      min_lot_size:
        value: 5750
        unit: "square_feet"
        code_ref: "25-2-492"
        notes: "Reduced from 5,750 sf for HOME ADU eligibility."
      min_lot_width:
        value: 50
        unit: "feet"
        code_ref: "25-2-492"
      front_setback:
        value: 25
        unit: "feet"
        code_ref: "25-2-492"
      side_setback:
        value: 5
        unit: "feet"
        code_ref: "25-2-492"
      rear_setback:
        value: 10
        unit: "feet"
        code_ref: "25-2-492"
      max_impervious_cover:
        value: 45
        unit: "percent"
        code_ref: "25-2-492"
      max_building_coverage:
        value: 40
        unit: "percent"
        code_ref: "25-2-492"
    parking:
      - use_id: single_family_detached
        rate: 2.0
        unit: "spaces_per_unit"
        code_ref: "25-6-471"
      - use_id: duplex
        rate: 2.0
        unit: "spaces_per_unit"
        code_ref: "25-6-471"
      - use_id: accessory_dwelling_unit
        rate: 0.0
        unit: "spaces_per_unit"
        code_ref: "25-6-478"
        notes: "ADU parking eliminated under 2024 amendments."
    overlay_interactions:
      - overlay_id: NCCD
        effect: >
          Neighborhood Conservation Combining District modifies
          setbacks, height, and FAR per neighborhood-specific
          plan adopted in §25-2-743.
        code_ref: "25-2-743"
      - overlay_id: NP
        effect: >
          Neighborhood Plan combining district may add use
          restrictions or special development standards
          specific to the plan area.
        code_ref: "25-2-1453"
      - overlay_id: McMansion
        effect: >
          Subchapter F (Residential Design and Compatibility
          Standards) restricts height + FAR + tent envelope on
          lots subject to McMansion ordinance.
        code_ref: "25-2 Subchapter F"

