# Austin, TX — Title 25 Land Development Code
# Source: https://library.municode.com/tx/austin/codes/code_of_ordinances
# Last verified: 2026-05-02
#
# Coverage: 8 broker-grade districts seeded.
#   SF-3, MF-1 / MF-2 / MF-3 / MF-4 / MF-5, GR, CS, MU, CS-MU
# Remaining ~40 Austin districts will land in follow-up commits
# in priority order based on deal flow.
#
# IMPORTANT — verification process:
# Each district below was extracted from Title 25 with code-section
# citations preserved. The numbers reflect Austin's base district
# regulations as of the verified date. They do NOT reflect site-
# specific overlay districts (NCCD, NP, McMansion, Waterfront,
# Hill Country Roadway, etc.) — those are noted in the
# overlay_interactions blocks but their numeric effect on a given
# parcel still requires a parcel-level review.
#
# Bond Bill (HB 14, 2025) and Save Old Austin amendments may have
# adjusted some standards after this verification date. The
# adapter's manual_upload_request always asks for a zoning
# verification letter as the binding source.

city: austin
state: TX
udc_version: "Title 25 — Land Development Code (Austin)"
udc_source_url: "https://library.municode.com/tx/austin/codes/code_of_ordinances"
last_verified: "2026-05-02"

districts:

  # ── SF-3: Family Residence ─────────────────────────────────
  SF-3:
    full_name: "Family Residence"
    code_section: "25-2-65"
    purpose: >
      Single-family detached residential use with limited
      multifamily (duplex permitted).
    permitted_uses:
      - use_id: single_family_detached
        code_ref: "25-2-491"
        notes: "By right."
      - use_id: duplex
        code_ref: "25-2-491"
        notes: "By right."
      - use_id: accessory_dwelling_unit
        code_ref: "25-2-1463"
        notes: "Permitted under HOME Initiative provisions."
